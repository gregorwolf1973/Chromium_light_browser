<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromium Light Browser</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='10' fill='%231a73e8'/><rect x='10' y='14.5' width='44' height='35' rx='4' fill='none' stroke='white' stroke-width='2.4'/><path d='M11 23.5h42' stroke='white' stroke-width='2.4'/><circle cx='16' cy='19' r='1.5' fill='white'/><circle cx='21.5' cy='19' r='1.5' fill='white'/><circle cx='27' cy='19' r='1.5' fill='white'/><circle cx='32.5' cy='35.5' r='8' fill='white'/><circle cx='37' cy='32.5' r='7.5' fill='%231a73e8'/><circle cx='42' cy='31' r='1.75' fill='white'/><circle cx='46.5' cy='37.5' r='1.25' fill='white'/></svg>">
<style>
  :root { color-scheme: light; --bg:#f5f6fa; --card:#ffffff; --border:#e1e5eb; --text:#1c1c1c; --dim:#6e7681;
          --accent:#1a73e8; --accent-text:#fff; --danger:#db4437; --chip:#f0f2f5; }
  @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg:#111318; --card:#1c1f27; --border:#333842;
          --text:#c8cdd5; --dim:#7b8390; --accent:#8ab4f8; --accent-text:#0a0a0a; --chip:#252830; } }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; height:100%; background:#000; color:var(--text);
               font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  #screen, #vnc { position:absolute; inset:0; }
  button { font:inherit; color:var(--text); background:var(--chip); border:1px solid var(--border); border-radius:8px;
           padding:8px 14px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:var(--accent-text); border-color:var(--accent); font-weight:600; }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); padding:20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:26px 28px; max-width:560px; width:100%; text-align:center; }
  .card h1 { font-size:1.2rem; margin:0 0 6px; }
  .card p { color:var(--dim); margin:0 0 16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; margin-top:16px; }
  .grid button { padding:12px 8px; }
  .err { color:var(--danger); margin-top:12px; font-size:13px; }
  .panel { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:420px; max-width:calc(100% - 24px);
           background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; box-shadow:0 12px 40px rgba(0,0,0,.45); z-index:5; }
  .panel h2 { font-size:1rem; margin:0 0 4px; }
  .panel .dim { color:var(--dim); font-size:12px; margin-bottom:10px; }
  .panel textarea { width:100%; height:140px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px; font:inherit; }
  .panel .row { display:flex; gap:6px; justify-content:flex-end; margin-top:10px; flex-wrap:wrap; }
  .toast { position:absolute; left:50%; bottom:18px; transform:translateX(-50%); background:rgba(20,20,20,.85); color:#fff; padding:6px 12px;
           border-radius:8px; font-size:12px; z-index:6; pointer-events:none; }
  .spinner { width:28px; height:28px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 12px; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="screen">
  <div id="vnc"></div>
  <div class="overlay" id="overlay"><div class="card" id="card"></div></div>
  <div class="panel" id="clip-panel" hidden>
    <h2>📋 Zwischenablage</h2>
    <div class="dim">Oben steht, was im Browser zuletzt kopiert wurde. Eigenen Text hier einfügen und mit „In den Browser“ übertragen – danach im Browser mit Strg+V einfügen.</div>
    <textarea id="clip-text"></textarea>
    <div class="row">
      <button id="clip-close">Schließen</button>
      <button id="clip-copy">Auf dieses Gerät kopieren</button>
      <button class="primary" id="clip-send">In den Browser</button>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>
</div>
<script>window.CLB_CONFIG = /*__CONFIG__*/null;</script>
<script type="module" src="static/app.js"></script>
</body>
</html>
