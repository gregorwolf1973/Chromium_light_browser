name: "Chromium Light Browser"
description: "Sparsamer Chromium in der Seitenleiste - startet bei Bedarf und schlaeft nach Leerlauf ein"
version: "0.2.1"
url: "https://github.com/gregorwolf1973/Chromium_light_browser"
slug: "chromium_light_browser"
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: "mdi:google-chrome"
panel_title: "Browser"
map:
  - share:rw
options:
  idle_minutes: 15
  sites:
    - name: "WhatsApp"
      url: "https://web.whatsapp.com"
      logout_on_sleep: false
    - name: "Sparkasse"
      url: "https://www.sparkasse.de"
      logout_on_sleep: true
  logout_domains: []
  save_passwords: false
  low_memory_mode: true
  renderer_process_limit: 4
  language: "de"
schema:
  idle_minutes: int(0,1440)
  sites:
    - name: str
      url: url
      logout_on_sleep: bool?
  logout_domains:
    - str?
  save_passwords: bool
  low_memory_mode: bool
  renderer_process_limit: int(1,16)
  language: str
